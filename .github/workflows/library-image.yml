# This is a basic workflow to help you get started with Actions

name: library-image

# Controls when the action will run.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: initialization
        uses: actions/checkout@v2

      - name: synchronous_mirroring
        uses: hhyasdf/image-sync-action@v1.1
        with:
          auth_file: ./auth.json # The auth information file of registries, optional.
          images_file: ./all_lib.yaml # The images file descirbes which images need to sync, always needed.
          version: latest # The version of image-syncer, use the latest version if not specified.
          proc: 6 # The max number of goroutines to sync images, default value is 5.
        env:
          AI_USER_NAME: ${{ secrets.AI_USER_NAME }}
          AI_USER_PASSWORD: ${{ secrets.AI_USER_PASSWORD }}
